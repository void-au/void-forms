sites:
  - site_id: void-labs
    allowed_origins:
      - http://localhost:3000
      - http://localhost:5173
      - https://voidlabs.com.au
    allowed_attributes:
      - name
      - company
      - message
      - email
      - area-of-interest
    validation:
      name:
        max_length: 100
      company:
        max_length: 120
      message:
        required: false
        max_length: 2000
      email:
        required: true
        type: email
      area-of-interest:
        options:
          - web
          - ai
          - architecture
          - hardware
          - mobile
          - consulting
          - other
    turnstile_secret_env: TURNSTILE_SECRET_DEMO_SITE
